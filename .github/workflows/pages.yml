name: Deploy OD75 to Pages
run-name: OD75 Cargo Marker B68 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node for gameplay checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify complete gameplay state and input routes
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm test
      - name: Verify B68 cargo marker and previous build contracts
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js b21-35.js b21-36.js b21-37.js b21-38.js b21-39.js b21-40.js b21-41.js b21-42.js b21-43.js b21-44.js b21-45.js b21-46.js b21-47.js b21-48.js b21-49.js b21-50.js b21-51.js b21-52.js b21-53.js b21-54.js b21-55.js b21-56.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B50_BOSS_TELEGRAPH_START=.55' b21-37.js
          grep -Fq 'const B51_PIP_BOND_SECONDS=1.0' b21-38.js
          grep -Fq 'drawPipPresenceB49=function(){}' b21-38.js
          grep -Fq 'S.b51PipBond=1' b21-38.js
          grep -Fq 'S.b51PipBondVisual' b21-38.js
          grep -Fq 'S.weaponPower=1+(saved.weaponPower-1)*b' b21-38.js
          grep -Fq 'shots[i].power*=b' b21-38.js
          grep -Fq 'function drawPipBondHeartB51()' b21-38.js
          grep -Fq 'heartPathB51' b21-38.js
          grep -Fq '!S?.b52HeartOnlyBond' b21-08.js
          grep -Fq 'function enableHeartOnlyBondB52()' b21-39.js
          grep -Fq 'tip.textContent.startsWith("PIP COLLECTING")' b21-39.js
          ! grep -q 'BONUSES OFF' b21-39.js
          grep -Fq 'function ensureSoundLabWalletB53()' b21-40.js
          grep -Fq 'function explainSoundLabBlockB53(kind,id,index)' b21-40.js
          grep -Fq 'btn.disabled=false' b21-40.js
          grep -Fq 'beginSoundLabHoldB45=function(btn,e)' b21-40.js
          grep -Fq 'renderAudioChoicesB41=function()' b21-40.js
          ! grep -q 'PAIRS ONLY' b21-40.js
          grep -Fq 'function startKeyboardSoundLabHoldB54(e)' b21-41.js
          grep -Fq 'beginSoundLabHoldB45(btn,syntheticSoundLabHoldEventB54("keyboard"))' b21-41.js
          grep -Fq 'pressGamepadMenuA_B35=function()' b21-41.js
          grep -Fq 'soundLabHold.pointerId==="gamepad"' b21-41.js
          grep -Fq 'const B55_CHARGER_COMMIT_WINDOW=.22' b21-42.js
          grep -Fq 'function lockChargerLaneB55(e)' b21-42.js
          grep -Fq 'e.vx=Math.cos(a)*340' b21-42.js
          grep -Fq 'function drawCommittedChargerLanesB55()' b21-42.js
          grep -Fq 'drawThreatTelegraphsB50=function()' b21-42.js
          grep -Fq 'const B56_BOND_CUE_SECONDS=.34' b21-43.js
          grep -Fq 'function initBondCueB56()' b21-43.js
          grep -Fq 'S.b56BondCueKind="empty"' b21-43.js
          grep -Fq 'S.b56BondCueKind="full"' b21-43.js
          grep -Fq 'function drawBondEndpointPulseB56()' b21-43.js
          grep -Fq 'function installStickySoundLabWalletB57()' b21-44.js
          grep -Fq 'position:sticky' b21-44.js
          grep -Fq 'wallet.setAttribute("role","status")' b21-44.js
          grep -Fq 'const B58_ASCENDED_BASE_SECONDS=8' b21-45.js
          grep -Fq 'if(S?.overType==="pip"&&S.over>0)return true' b21-45.js
          grep -Fq 'if(S.b58AscTime<=0){S.heat=0;stopOverdriveB38(true)}' b21-45.js
          grep -Fq 'function mixPairingCopyB58(layer)' b21-45.js
          grep -Fq 'BOOSTED BY' b21-45.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js b21-35.js b21-36.js b21-37.js b21-38.js b21-39.js b21-40.js b21-41.js b21-42.js b21-43.js b21-44.js b21-45.js b21-46.js b21-47.js b21-48.js b21-49.js b21-50.js b21-51.js b21-52.js b21-53.js b21-54.js b21-55.js b21-56.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const B50_BOSS_TELEGRAPH_START=.55',
              'const B51_PIP_BOND_SECONDS=1.0',
              'drawPipPresenceB49=function(){}',
              'function pipBondB51()',
              'function drawPipBondHeartB51()',
              '!S?.b52HeartOnlyBond',
              'function enableHeartOnlyBondB52()',
              'tip.textContent.startsWith("PIP COLLECTING")',
              'function ensureSoundLabWalletB53()',
              'function explainSoundLabBlockB53(kind,id,index)',
              'beginSoundLabHoldB45=function(btn,e)',
              'renderAudioChoicesB41=function()',
              'function startKeyboardSoundLabHoldB54(e)',
              'pressGamepadMenuA_B35=function()',
              'const B55_CHARGER_COMMIT_WINDOW=.22',
              'function drawCommittedChargerLanesB55()',
              'const B56_BOND_CUE_SECONDS=.34',
              'function drawBondEndpointPulseB56()',
              'function installStickySoundLabWalletB57()',
              'position:sticky',
              'const B58_ASCENDED_BASE_SECONDS=8',
              'function mixPairingCopyB58(layer)',
              'BOOSTED BY'
          ]:
              assert marker in s, marker
          assert s.rfind('pipWithPlayer=function()') > s.find('function pipWithPlayer()')
          assert s.rfind('update=function(dt)') > s.find('// B51 Pip bond meter')
          assert s.rfind('attack=function()') > s.find('// B51 Pip bond meter')
          assert s.rfind('draw=function()') > s.find('// B51 Pip bond meter')
          assert s.rfind('drawPipBondHeartB51()') > s.rfind('drawThreatTelegraphsB50()')
          assert s.rfind('updateUI=function()') > s.find('// B52 Heart-only Pip bond clarity')
          assert 'BONUSES OFF' not in s[s.find('// B52 Heart-only Pip bond clarity'):]
          assert s.rfind('beginSoundLabHoldB45=function(btn,e)') > s.find('// B53 Sound Lab usability')
          assert s.rfind('renderPipSoundStepB26=function()') > s.find('// B53 Sound Lab usability')
          assert s.rfind('renderAudioChoicesB41=function()') > s.find('// B53 Sound Lab usability')
          assert 'PAIRS ONLY' not in s[s.find('// B53 Sound Lab usability'):]
          assert s.rfind('pressGamepadMenuA_B35=function()') > s.find('// B54 Sound Lab input parity')
          assert s.rfind('releaseGamepadMenuA_B35=function()') > s.find('// B54 Sound Lab input parity')
          assert s.rfind('updateEnemy=function(e,dt)') > s.find('// B55 Committed charger lanes')
          assert s.rfind('drawThreatTelegraphsB50=function()') > s.find('// B55 Committed charger lanes')
          assert s.rfind('update=function(dt)') > s.find('// B56 Pip bond endpoint pulse')
          assert s.rfind('drawPipBondHeartB51=function()') > s.find('// B56 Pip bond endpoint pulse')
          assert s.rfind('stickySoundLabWalletStyleB57') > s.find('// B57 Sticky Sound Lab resources')
          assert s.rfind('triggerOverdrive=function()') > s.find('// B58 Ascended control')
          assert s.rfind('simplifyPipSoundCardsB53=function()') > s.find('// B58 Ascended control')
          assert s.rfind('simplifyMixCardsB53=function()') > s.find('// B58 Ascended control')
          assert s.index('// B59 Pip partnership') < s.index('// B59 Boss personalities') < s.index('// B59 Presentation')
          assert s.rfind('const updateBeforeB59=update;') > s.index('// B59 Boss personalities')
          assert 'function consumeSetupB59(' in s
          assert 'function incomingThreatB59()' in s
          assert s.index('// B60 Heart transport') > s.index('// B59 Presentation')
          assert s.index('// B60 Audible mix') > s.index('// B60 Heart transport')
          assert 'function updatePipTransportB60(dt)' in s
          assert s.index('// B61 Saved movement tuning') > s.index('// B60 Audible mix')
          assert 'function swiftSpeedB61(' in s and 'const maxSpeed=playerSpeedB61()' in s
          assert 'const B62_LONELY_SPEED_FACTOR=.9' in s
          assert s.index('// B63 Partnership survival') > s.index('// B61 Saved movement tuning')
          assert 'runHearts:0' in s and 'function emergencyRecallB63()' in s
          assert 'pipDetectRange:82' in s and 'earlyRunHearts:0' in s
          assert s.index('// B65 Difficulty HUD') > s.index('// B63 Partnership survival')
          assert s.index('// B66 Supportive emergency return clarity') > s.index('// B65 Difficulty HUD')
          assert s.index('// B67 Preserve Supportive-dropped cargo') > s.index('// B66 Supportive emergency return clarity')
          assert s.index('// B68 One visual recovery marker') > s.index('// B67 Preserve Supportive-dropped cargo')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-09-03-B68-CARGO-MARKER/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B68-CARGO-MARKER/g' _site/index.html
          grep -Fq 'OD75-2026-09-03-B68-CARGO-MARKER' _site/index.html
          grep -Fq 'game.js?v=B68-CARGO-MARKER' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
