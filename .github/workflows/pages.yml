name: Deploy OD75 to Pages
run-name: OD75 direct B18 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify direct game source
        run: |
          test -f index.html
          test -f styles.css
          for f in game-1.js game-2.js game-3.js game-4.js; do
            test -f "$f"
            node --check "$f"
          done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'OD75-2026-08-12-B18' index.html
          grep -Fq 'dtap<=660' game-*.js
          grep -Fq 'turnDelta>(8*Math.PI/180)' game-*.js
          grep -Fq 'S.waveBreak=stageEnd?10:4.2;' game-*.js
          grep -Fq 'S.heartTotal=(S.heartTotal||0)+1' game-*.js

      - name: Assemble direct site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html styles.css game-1.js game-2.js game-3.js game-4.js _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
