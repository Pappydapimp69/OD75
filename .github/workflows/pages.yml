name: Deploy OD75 to Pages
run-name: OD75 Hold Unlock B25 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify held unlocks and banked Overdrive charge
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'function triggerOverdrive()' b21-*.js
          grep -Fq 'OVER_ORDER=["beam","storm","guardian","nova","gravity","pip"]' b21-*.js
          grep -Fq 'BOSS_STAR_THRESHOLDS=[4,11,20,32,47,65]' b21-*.js
          grep -Fq 'if(S.stageEnding&&!S.stagePending)' b21-04.js
          grep -Fq 'if(S.bossRewardPending){openOverdriveStep();return}' b21-04.js
          grep -Fq 'const OVERDRIVE_HOLD_MS=1800' b21-09.js
          grep -Fq 'function completeOverdriveHoldAction(id)' b21-09.js
          grep -Fq 'S.overUnlocked.add(id)' b21-09.js
          grep -Fq 'S.overLevels[id]=lv+1' b21-09.js
          grep -Fq 'hold the skill to unlock it' b21-09.js
          grep -Fq 'HOLD TO UNLOCK' b21-09.js
          grep -Fq 'HOLD TO UPGRADE' b21-09.js
          ! grep -Fq 'TAP TO UNLOCK' b21-09.js
          ! grep -Fq '4 seconds' b21-09.js
          ! grep -Fq '4s' b21-09.js
          grep -Fq 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' b21-11.js
          grep -Fq 'PipAudioEngine.prototype.scheduleBossStep=function(time)' b21-10.js
          grep -Fq 'hpRatio<=.30?2:hpRatio<=.65?1:0' b21-10.js
          grep -Fq 'hasAudio("melody")' b21-10.js
          grep -Fq 'hasAudio("harmony")' b21-10.js
          grep -Fq 'hasAudio("bass")' b21-10.js
          grep -Fq 'hasAudio("bells")' b21-10.js
          grep -Fq 'hasAudio("heartbeat")' b21-10.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          assert 'const OVERDRIVE_HOLD_MS=1800' in s
          assert 'function completeOverdriveHoldAction(id)' in s
          assert 'HOLD TO UNLOCK' in s and 'HOLD TO UPGRADE' in s
          assert 'TAP TO UNLOCK' not in s
          assert 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' in s
          old=s.find('scheduleBossStep(time){')
          new=s.rfind('PipAudioEngine.prototype.scheduleBossStep=function(time)')
          assert old >= 0 and new > old, (old,new)
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B25-HOLD-UNLOCK/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B25-HOLD-UNLOCK/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B25-HOLD-UNLOCK' _site/index.html
          grep -Fq 'game.js?v=B25-HOLD-UNLOCK' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
