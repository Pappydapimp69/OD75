name: Deploy OD75 to Pages
run-name: OD75 Threat Telegraphs B50 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify B50 threat telegraphs and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js b21-35.js b21-36.js b21-37.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B48_BEACON_MARGIN=46' b21-35.js
          grep -Fq 'const B49_RETURN_PULSE_SECONDS=.85' b21-36.js
          grep -Fq 'const B50_BOSS_TELEGRAPH_START=.55' b21-37.js
          grep -Fq 'const B50_CHARGER_TELEGRAPH_WINDOW=.45' b21-37.js
          grep -Fq 'function bossVolleyIntervalB50' b21-37.js
          grep -Fq 'VOLLEY' b21-37.js
          grep -Fq 'CHARGE' b21-37.js
          grep -Fq 'drawThreatTelegraphsB50' b21-37.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js b21-35.js b21-36.js b21-37.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in ['const B50_BOSS_TELEGRAPH_START=.55','function bossVolleyIntervalB50','function drawThreatTelegraphsB50()']:
              assert marker in s, marker
          assert s.rfind('draw=function()') > s.find('// B50 Threat telegraphs')
          assert s.rfind('drawThreatTelegraphsB50()') > s.rfind('drawPipPresenceB49()')
          assert '1.55-(e?.bossStage||1)*.022' in s
          assert 'spread=.82' in s
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B50-THREAT-TELEGRAPHS/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B50-THREAT-TELEGRAPHS/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B50-THREAT-TELEGRAPHS' _site/index.html
          grep -Fq 'game.js?v=B50-THREAT-TELEGRAPHS' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
