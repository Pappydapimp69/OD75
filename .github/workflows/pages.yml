name: Deploy OD75 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild static site
        run: |
          mkdir -p _site
          cat payload-0.txt payload-1.txt payload-2.txt payload-3.txt | base64 --decode | gzip --decompress > _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text()
          addons = '<script src="gamepad.js"></script><script src="heart-total.js"></script><script src="double-tap-dash.js"></script>'
          if '</body>' in html:
              html = html.replace('</body>', addons + '</body>', 1)
          else:
              html += addons
          p.write_text(html)
          PY
          cp gamepad.js heart-total.js double-tap-dash.js _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
