name: Deploy OD75 to Pages
run-name: OD75 Unique Mix Layers B46 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify B46 unique Mix Layers and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B45_EXPLORATION_KILL_INTERVAL=15' b21-32.js
          grep -Fq 'const B46_MIX_LAYERS=[' b21-33.js
          grep -Fq 'packs:["honey","plush"]' b21-33.js
          grep -Fq 'packs:["starlight","cherub"]' b21-33.js
          grep -Fq 'packs:["bubble","cosmic"]' b21-33.js
          grep -Fq 'S.b46MixLevels={heartmix:0,starmix:0,orbitmix:0}' b21-33.js
          grep -Fq 'all three audio components deepened together' b21-33.js
          grep -Fq 'no Pip Sound is reused' b21-33.js
          grep -Fq 'KEEP HOLDING · RELEASE TO CANCEL' b21-32.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('_site/game.js').read_text()
          for marker in [
              'const B45_EXPLORATION_KILL_INTERVAL=15',
              'const B46_MIX_LAYERS=[',
              'function mixLevelB46',
              'function mixUpgradeCostB46',
              'no Pip Sound is reused'
          ]:
              assert marker in s, marker
          pairs=re.findall(r'packs:\["([^"]+)","([^"]+)"\]', Path('b21-33.js').read_text())
          flat=[x for pair in pairs[:3] for x in pair]
          assert len(flat)==6, flat
          assert len(set(flat))==6, flat
          assert set(flat)=={'honey','plush','starlight','cherub','bubble','cosmic'}, flat
          assert s.rfind('chooseAudioOptionsB41=function') > s.find('// B42 Sound engine')
          assert s.rfind('renderAudioChoicesB41=function') > s.find('// B45 cadence')
          assert s.rfind('soundLabAffordableB45=function') > s.find('// B45 cadence')
          assert s.rfind('completeSoundLabHoldB45=function') > s.find('// B45 cadence')
          assert s.rfind('resonanceRankB42=function') > s.find('// B42 Sound engine')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B46-UNIQUE-MIX-LAYERS/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B46-UNIQUE-MIX-LAYERS/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B46-UNIQUE-MIX-LAYERS' _site/index.html
          grep -Fq 'game.js?v=B46-UNIQUE-MIX-LAYERS' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
