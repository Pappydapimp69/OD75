name: Deploy OD75 to Pages
run-name: OD75 Progression Cadence B45 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify B45 progression cadence and Sound Lab hold
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B43_ASCENDED_IGNITION_HEAT=100' b21-31.js
          grep -Fq 'const B45_EXPLORATION_KILL_INTERVAL=15' b21-32.js
          grep -Fq 'lv===5||lv===10||(lv>=20&&lv%10===0)' b21-32.js
          grep -Fq 'S.audioMixCredits=0' b21-32.js
          grep -Fq 'const SOUNDLAB_HOLD_MS=typeof OVERDRIVE_HOLD_MS' b21-32.js
          grep -Fq 'KEEP HOLDING · RELEASE TO CANCEL' b21-32.js
          grep -Fq 'completeSoundLabHoldB45' b21-32.js
          grep -Fq 'Releasing early cancels' b21-32.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const B43_ASCENDED_IGNITION_HEAT=100',
              'const B45_EXPLORATION_KILL_INTERVAL=15',
              'function isMixChoiceLevelB45',
              'const SOUNDLAB_HOLD_MS=',
              'function completeSoundLabHoldB45',
              'KEEP HOLDING · RELEASE TO CANCEL'
          ]:
              assert marker in s, marker
          assert s.rfind('checkKillMilestoneDropB30=function') > s.find('const EXPLORATION_KILL_INTERVAL_B30=30')
          assert s.rfind('gainPipXP=function') > s.find('// B41 Sound Lab progression')
          assert s.rfind('selectPipSoundPackB26=function') > s.find('// B31 cumulative audio')
          assert s.rfind('chooseAudioUnlock=function') > s.find('// B42 Sound engine')
          assert s.rfind('renderPipSoundStepB26=function') > s.find('// B42 Sound engine')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B45-PROGRESSION-CADENCE/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B45-PROGRESSION-CADENCE/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B45-PROGRESSION-CADENCE' _site/index.html
          grep -Fq 'game.js?v=B45-PROGRESSION-CADENCE' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
