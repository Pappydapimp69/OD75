name: Deploy OD75 to Pages
run-name: OD75 Upgrade Readability B40 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify B40 upgrade readability and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B38_BASIC_IGNITION_PERCENT=20' b21-25.js
          grep -Fq 'function ensureAscendedPauseB39()' b21-26.js
          grep -Fq 'Evolution ${tier}' b21-27.js
          grep -Fq 'installUpgradeCompressionB40' b21-28.js
          grep -Fq 'grid-template-columns:auto 1fr' b21-28.js
          grep -Fq 'font-size:17px' b21-28.js
          grep -Fq 'Spend Heart Bits to strengthen Pip for this run.' b21-28.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const B38_BASIC_IGNITION_PERCENT=20',
              'function ensureAscendedPauseB39()',
              'Evolution ${tier}',
              'installUpgradeCompressionB40',
              'grid-template-columns:auto 1fr',
              'Spend Heart Bits to strengthen Pip for this run.'
          ]:
              assert marker in s, marker
          assert s.rfind('renderPipPortraitB39=function()') > s.find('function renderPipPortraitB39()')
          assert s.rfind('installUpgradeCompressionB40') > s.rfind('const B39_ECHO_TEXT=')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B40-UPGRADE-READABILITY/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B40-UPGRADE-READABILITY/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B40-UPGRADE-READABILITY' _site/index.html
          grep -Fq 'game.js?v=B40-UPGRADE-READABILITY' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
