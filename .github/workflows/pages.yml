name: Deploy OD75 to Pages
run-name: OD75 Arena Currency HUD B47 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify B47 arena currency HUD and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const B46_MIX_LAYERS=[' b21-33.js
          grep -Fq 'const B47_CURRENCY_HUD_IDLE_SECONDS=1.4' b21-34.js
          grep -Fq 'const B47_CURRENCY_HUD_MOVE_SPEED=8' b21-34.js
          grep -Fq 'font-size:30px' b21-34.js
          grep -Fq 'border:0;border-radius:0' b21-34.js
          grep -Fq 'background:transparent;backdrop-filter:none' b21-34.js
          grep -Fq 'hyp(P.vx||0,P.vy||0)>B47_CURRENCY_HUD_MOVE_SPEED' b21-34.js
          grep -Fq 'S.b47CurrencyHudIdle<B47_CURRENCY_HUD_IDLE_SECONDS' b21-34.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js b21-18.js b21-19.js b21-20.js b21-21.js b21-22.js b21-23.js b21-24.js b21-25.js b21-26.js b21-27.js b21-28.js b21-29.js b21-30.js b21-31.js b21-32.js b21-33.js b21-34.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const B46_MIX_LAYERS=[',
              'const B47_CURRENCY_HUD_IDLE_SECONDS=1.4',
              'function currencyItemsB47()',
              'function renderCurrencyHudB47()',
              'font-size:30px',
              'hyp(P.vx||0,P.vy||0)>B47_CURRENCY_HUD_MOVE_SPEED'
          ]:
              assert marker in s, marker
          assert s.rfind('updateUI=function') > s.find('// B46 Mix Layer rework')
          assert s.rfind('update=function(dt)') > s.find('// B43 Ascended Pip ignition')
          assert s.rfind('renderCurrencyHudB47') > s.find('// B47 arena currency HUD')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B47-ARENA-CURRENCY-HUD/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B47-ARENA-CURRENCY-HUD/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B47-ARENA-CURRENCY-HUD' _site/index.html
          grep -Fq 'game.js?v=B47-ARENA-CURRENCY-HUD' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
