name: Deploy OD75 to Pages
run-name: OD75 Rarity B30 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify rarity, Pip sounds and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const OVERDRIVE_HOLD_MS=1800' b21-09.js
          grep -Fq 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' b21-11.js
          grep -Fq 'PipAudioEngine.prototype.scheduleBossStep=function(time)' b21-10.js
          grep -Fq 'function updateAscendantHeartMagnetB26(dt)' b21-12.js
          grep -Fq 'function overdriveDurationB27(id,lv)' b21-13.js
          grep -Fq 'return 5.00+n*.55' b21-13.js
          grep -Fq 'function renderEmotionButtonsB28()' b21-14.js
          grep -Fq 'Prism Seeds deepen Loving, Compassionate, and Supportive' b21-14.js
          grep -Fq 'S.heartCurrency-=cost' b21-14.js
          grep -Fq 'const PIP_SOUND_MAX_LEVEL=4' b21-15.js
          grep -Fq 'S.pipSoundCredits=1' b21-15.js
          grep -Fq 'S.pipSoundCredits=(S.pipSoundCredits||0)+(after-before)' b21-15.js
          grep -Fq 'Each Pip level grants one sound choice.' b21-15.js
          grep -Fq 'S.pipSoundCredits--' b21-15.js
          grep -Fq 'S.pipSoundLevels[id]=lv+1' b21-15.js
          grep -Fq 'function pipSoundFlairB29' b21-15.js
          grep -Fq 'const EXPLORATION_KILL_INTERVAL_B30=30' b21-16.js
          grep -Fq 'const EXPLORATION_ROLL_CHANCE_B30=.10' b21-16.js
          grep -Fq 'while(S.kills>=S.b30LastKillMilestone+EXPLORATION_KILL_INTERVAL_B30)' b21-16.js
          grep -Fq 'if(rnd()>=EXPLORATION_ROLL_CHANCE_B30)return false' b21-16.js
          grep -Fq 'musicNoteDrops.push(note);prismSeedDrops.push(prism)' b21-16.js
          grep -Fq 'killBoss=function(e)' b21-16.js
          grep -Fq 'updateB26Drops=function(dt)' b21-16.js
          ! grep -Fq 'b26AmbientTimer-=dt' b21-16.js
          ! grep -Fq 'b26MusicEventTimer-=dt' b21-16.js
          ! grep -Fq 'b26PrismEventTimer-=dt' b21-16.js
          grep -Fq 'const duplicate=$("skipEmotionB28")' b21-17.js
          grep -Fq 'if(duplicate)duplicate.remove()' b21-17.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js b21-15.js b21-16.js b21-17.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const OVERDRIVE_HOLD_MS=1800',
              'function updateAscendantHeartMagnetB26(dt)',
              'function overdriveDurationB27(id,lv)',
              'function renderEmotionButtonsB28()',
              'const PIP_SOUND_MAX_LEVEL=4',
              'S.pipSoundCredits=(S.pipSoundCredits||0)+(after-before)',
              'const EXPLORATION_KILL_INTERVAL_B30=30',
              'const EXPLORATION_ROLL_CHANCE_B30=.10',
              'musicNoteDrops.push(note);prismSeedDrops.push(prism)',
              'const duplicate=$("skipEmotionB28")'
          ]:
              assert marker in s, marker
          assert s.rfind('renderAbilityShop=function()') > s.find('// One Prism Seed buys one attribute level.')
          assert s.rfind('renderPipSoundStepB26=function()') > s.find('function renderPipSoundStepB26()')
          assert s.rfind('selectPipSoundPackB26=function(id)') > s.find('function selectPipSoundPackB26(id)')
          assert s.rfind('gainPipXP=function(amount,reason="")') > s.find('function gainPipXP(amount,reason="")')
          assert s.rfind('updateB26Drops=function(dt)') > s.find('function updateB26Drops(dt)')
          assert s.rfind('killBoss=function(e)') > s.find('function killBoss(e)')
          assert s.rfind('renderEmotionButtons=function()') > s.find('function renderEmotionButtonsB28()')
          assert s.rfind('triggerOverdrive=function()') > s.find('function triggerOverdrive()')
          tail=s[s.rfind('updateB26Drops=function(dt)'):]
          assert 'b26AmbientTimer-=dt' not in tail
          assert 'b26MusicEventTimer-=dt' not in tail
          assert 'b26PrismEventTimer-=dt' not in tail
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B30-RARITY/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B30-RARITY/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B30-RARITY' _site/index.html
          grep -Fq 'game.js?v=B30-RARITY' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
