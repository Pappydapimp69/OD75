name: Deploy OD75 to Pages
run-name: OD75 Overdrive Duration B27 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify Overdrive duration and exploration source
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const OVERDRIVE_HOLD_MS=1800' b21-09.js
          grep -Fq 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' b21-11.js
          grep -Fq 'PipAudioEngine.prototype.scheduleBossStep=function(time)' b21-10.js
          grep -Fq 'S.pipLevel=1;S.pipXP=0;S.pipLove=0;S.pipCompassion=0;S.pipSupport=0' b21-12.js
          grep -Fq 'function spawnMusicStarEvent()' b21-12.js
          grep -Fq 'function spawnPrismEvent()' b21-12.js
          grep -Fq 'function drawWaypointB26(item,color,symbol)' b21-12.js
          grep -Fq 'function updateAscendantHeartMagnetB26(dt)' b21-12.js
          grep -Fq 'function overdriveDurationB27(id,lv)' b21-13.js
          grep -Fq 'return 5.00+n*.55' b21-13.js
          grep -Fq 'S.over=overdriveDurationB27(id,lv)' b21-13.js
          grep -Fq 'Starts at 5 seconds' b21-13.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const OVERDRIVE_HOLD_MS=1800',
              'function resetPipRunProgressB26()',
              'function updateAscendantHeartMagnetB26(dt)',
              'function overdriveDurationB27(id,lv)',
              'S.over=overdriveDurationB27(id,lv)'
          ]:
              assert marker in s, marker
          durations={
              'beam':(3.48,.48),
              'storm':(3.82,.42),
              'guardian':(4.48,.48),
              'nova':(2.84,.34),
              'gravity':(4.26,.46),
              'pip':(5.00,.55),
          }
          for name,(base,gain) in durations.items():
              vals=[base+(lv-1)*gain for lv in range(1,6)]
              assert all(vals[i+1]>vals[i] for i in range(4)), (name,vals)
          assert abs(durations['pip'][0]-5.0)<1e-9
          assert s.rfind('triggerOverdrive=function()') > s.find('function triggerOverdrive()')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B27-OVERDRIVE-DURATION/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B27-OVERDRIVE-DURATION/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B27-OVERDRIVE-DURATION' _site/index.html
          grep -Fq 'game.js?v=B27-OVERDRIVE-DURATION' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
