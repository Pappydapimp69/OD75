name: Deploy OD75 to Pages
run-name: OD75 verified B17A ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild verified base game
        run: |
          mkdir -p _site
          cat payload-0.txt payload-1.txt payload-2.txt payload-3.txt | base64 --decode | gzip --decompress > _site/index.html
          echo "0834938f1c5244715b8dabc4c9fff3954185ea80d6de9846a59026280358a63e  _site/index.html" | sha256sum -c -

      - name: Verify behavior code
        run: |
          grep -q 'maxDelay: 660' double-tap-dash.js
          grep -q 'turnBrake.active && speed > 2' gamepad.js
          grep -q 'delta > 8 \* Math.PI / 180' gamepad.js
          grep -q 'STAGE_CLEAR_SECONDS = 10' stage-clear-timer.js
          grep -q 'WALLET · ${S.heartTotal || 0} TOTAL' heart-total.js

      - name: Assemble cache-busted site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text()
          build='OD75-2026-08-12-B17'
          addons=(
            f'<script src="gamepad.js?v={build}"></script>'
            f'<script src="heart-total.js?v={build}"></script>'
            f'<script src="double-tap-dash.js?v={build}"></script>'
            f'<script src="stage-clear-timer.js?v={build}"></script>'
            f'<div id="od75BuildStamp" style="position:fixed;left:8px;bottom:6px;z-index:9999;font:10px/1 system-ui;color:#ffffff66;pointer-events:none">{build}</div>'
          )
          if '</body>' in html:
              html=html.replace('</body>',addons+'</body>',1)
          else:
              html+=addons
          p.write_text(html)
          PY
          cp gamepad.js heart-total.js double-tap-dash.js stage-clear-timer.js _site/
          touch _site/.nojekyll
          grep -q 'OD75-2026-08-12-B17' _site/index.html
          grep -q 'double-tap-dash.js?v=OD75-2026-08-12-B17' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
