name: Deploy OD75 to Pages
run-name: OD75 Economy Fix B28 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify corrected Pip economies and current systems
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const OVERDRIVE_HOLD_MS=1800' b21-09.js
          grep -Fq 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' b21-11.js
          grep -Fq 'PipAudioEngine.prototype.scheduleBossStep=function(time)' b21-10.js
          grep -Fq 'function spawnMusicStarEvent()' b21-12.js
          grep -Fq 'function spawnPrismEvent()' b21-12.js
          grep -Fq 'function updateAscendantHeartMagnetB26(dt)' b21-12.js
          grep -Fq 'function overdriveDurationB27(id,lv)' b21-13.js
          grep -Fq 'return 5.00+n*.55' b21-13.js
          grep -Fq 'function renderEmotionButtonsB28()' b21-14.js
          grep -Fq 'Prism Seeds deepen Loving, Compassionate, and Supportive' b21-14.js
          grep -Fq 'S.prismSeeds--' b21-14.js
          grep -Fq 'Continue without emotional upgrade' b21-14.js
          grep -Fq '♥ ${S.heartCurrency} Heart Bits available' b21-14.js
          grep -Fq 'const cost=pipAbilityCost(kind)' b21-14.js
          grep -Fq 'S.heartCurrency-=cost' b21-14.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js b21-13.js b21-14.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const OVERDRIVE_HOLD_MS=1800',
              'function resetPipRunProgressB26()',
              'function updateAscendantHeartMagnetB26(dt)',
              'function overdriveDurationB27(id,lv)',
              'S.over=overdriveDurationB27(id,lv)',
              'function renderEmotionButtonsB28()',
              'Prism Seeds deepen Loving, Compassionate, and Supportive',
              'Continue without emotional upgrade',
              'S.prismSeeds--',
              '♥ ${S.heartCurrency} Heart Bits available',
              'S.heartCurrency-=cost'
          ]:
              assert marker in s, marker
          assert s.rfind('renderAbilityShop=function()') > s.find('// One Prism Seed buys one attribute level.')
          assert s.rfind('choosePipUpgrade=function(kind)') > s.find('function choosePipUpgrade(kind)')
          assert s.rfind('triggerOverdrive=function()') > s.find('function triggerOverdrive()')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B28-ECONOMY-FIX/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B28-ECONOMY-FIX/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B28-ECONOMY-FIX' _site/index.html
          grep -Fq 'game.js?v=B28-ECONOMY-FIX' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
