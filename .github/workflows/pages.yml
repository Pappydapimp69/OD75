name: Deploy OD75 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild canonical game
        run: |
          mkdir -p _site
          cat payload-0.txt payload-1.txt payload-2.txt payload-3.txt | base64 --decode | gzip --decompress > _site/index.html
          touch _site/.nojekyll

      - name: Verify canonical build
        run: |
          echo "e78d8bfe2ecc9cc602f7ee937f6af3db6e37f69266cd1dd7606c1911ef42704c  _site/index.html" | sha256sum -c -
          grep -q 'OD75-2026-08-12-B17' _site/index.html
          grep -q 'maxDelay: 660' _site/index.html
          grep -q 'turnBrake.active && speed > 2' _site/index.html
          grep -q 'STAGE_CLEAR_SECONDS = 10' _site/index.html
          grep -q 'WALLET · ${S.heartTotal || 0} TOTAL' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
