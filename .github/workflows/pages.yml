name: Deploy OD75 to Pages
run-name: OD75 Hold Upgrade B23 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify hold-upgrade and StarDrive source
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'function triggerOverdrive()' b21-*.js
          grep -Fq 'if(k==="e")triggerOverdrive()' b21-*.js
          grep -Fq 'OVER_ORDER=["beam","storm","guardian","nova","gravity","pip"]' b21-*.js
          grep -Fq 'BOSS_STAR_THRESHOLDS=[4,11,20,32,47,65]' b21-*.js
          grep -Fq 'if(S.stageEnding&&!S.stagePending)' b21-04.js
          grep -Fq 'if(S.bossRewardPending){openOverdriveStep();return}' b21-04.js
          grep -Fq 'const OVERDRIVE_HOLD_MS=4000' b21-09.js
          grep -Fq 'chooseOverdrive=function(id)' b21-09.js
          grep -Fq 'function completeOverdriveUpgrade(id)' b21-09.js
          grep -Fq 'S.overLevels[id]=lv+1' b21-09.js
          grep -Fq 'HOLD 4s TO UPGRADE' b21-09.js
          grep -Fq 'RELEASE TO CANCEL' b21-09.js
          grep -Fq 'linear-gradient(90deg' b21-09.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          old=s.find('function chooseOverdrive(id)')
          new=s.rfind('chooseOverdrive=function(id)')
          assert old >= 0 and new > old, (old,new)
          assert s.rfind('const OVERDRIVE_HOLD_MS=4000') > old
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B23-HOLD-UPGRADES/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B23-HOLD-UPGRADES/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B23-HOLD-UPGRADES' _site/index.html
          grep -Fq 'game.js?v=B23-HOLD-UPGRADES' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
