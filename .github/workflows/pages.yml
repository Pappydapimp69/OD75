name: Deploy OD75 to Pages
run-name: OD75 Exploration B26 ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify exploration progression source
        run: |
          test -f index.html
          for f in b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js; do test -f "$f"; node --check "$f"; done
          ! grep -q 'payload-' index.html
          ! grep -q 'DecompressionStream' index.html
          grep -Fq 'const OVERDRIVE_HOLD_MS=1800' b21-09.js
          grep -Fq 'if(S&&S.run&&S.over<=0&&S.heat<heatBefore)S.heat=heatBefore' b21-11.js
          grep -Fq 'PipAudioEngine.prototype.scheduleBossStep=function(time)' b21-10.js
          grep -Fq 'S.pipLevel=1;S.pipXP=0;S.pipLove=0;S.pipCompassion=0;S.pipSupport=0' b21-12.js
          grep -Fq 'rangeLv:0,speedLv:0,powerLv:0,guardLv:0,bossPowers:{}' b21-12.js
          grep -Fq 'const outsideCurrent=Math.abs(x-CAM.x)>W*.58||Math.abs(y-CAM.y)>H*.58' b21-12.js
          grep -Fq 'const outsideStart=Math.abs(x-startX)>W*.58||Math.abs(y-startY)>H*.58' b21-12.js
          grep -Fq 'function spawnMusicStarEvent()' b21-12.js
          grep -Fq 'function spawnPrismEvent()' b21-12.js
          grep -Fq 'function drawWaypointB26(item,color,symbol)' b21-12.js
          grep -Fq 'S.musicNotes=(S.musicNotes||0)+(n.reward||1)' b21-12.js
          grep -Fq 'S.prismSeeds=(S.prismSeeds||0)+1' b21-12.js
          grep -Fq 'one seed = one attribute level' b21-12.js
          grep -Fq 'S.prismSeeds--' b21-12.js
          grep -Fq 'const PIP_SOUND_PACKS=[' b21-12.js
          grep -Fq 'Music Notes unlock new Pip voice palettes for this run' b21-12.js
          grep -Fq 'function playPipPackCueB26' b21-12.js
          grep -Fq 'if(!S.run||S.end||S.over<=0||S.overType!=="pip")return' b21-12.js
          grep -Fq 'const radius=190+lv*75' b21-12.js
          grep -Fq 'const pullSpeed=260+lv*130' b21-12.js
          grep -Fq 'dtap<=660' b21-*.js
          grep -Fq 'touchLike&&joy.active&&e.pointerId!==joy.id' b21-*.js
          grep -Fq 'turnRate=(720-(400*speedRatio))*Math.PI/180' b21-*.js
          ! grep -Fq 'turnDelta>(8*Math.PI/180)' b21-*.js
      - name: Assemble direct site
        run: |
          rm -rf _site; mkdir _site
          cp index.html _site/
          cat b21-01.js b21-02.js b21-03.js b21-04.js b21-05.js b21-06.js b21-07.js b21-08.js b21-09.js b21-10.js b21-11.js b21-12.js > _site/game.js
          node --check _site/game.js
          python - <<'PY'
          from pathlib import Path
          s=Path('_site/game.js').read_text()
          for marker in [
              'const OVERDRIVE_HOLD_MS=1800',
              'PipAudioEngine.prototype.scheduleBossStep=function(time)',
              'function resetPipRunProgressB26()',
              'function spawnAmbientMusicNote()',
              'function spawnMusicStarEvent()',
              'function spawnPrismEvent()',
              'function drawWaypointB26(item,color,symbol)',
              'function updateAscendantHeartMagnetB26(dt)',
              'const radius=190+lv*75',
              'const pullSpeed=260+lv*130',
              'one seed = one attribute level',
              'Music Notes unlock new Pip voice palettes for this run'
          ]:
              assert marker in s, marker
          assert s.rfind('update=function(dt)') > s.find('// B25: manual Overdrive charge no longer decays.')
          assert s.rfind('draw=function()') > s.find('function draw(){')
          PY
          sed -i 's/OD75-2026-08-12-B21-STARDRIVE/OD75-2026-08-12-B26-EXPLORATION/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B26-EXPLORATION/g' _site/index.html
          grep -Fq 'OD75-2026-08-12-B26-EXPLORATION' _site/index.html
          grep -Fq 'game.js?v=B26-EXPLORATION' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
